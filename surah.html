<html lang="ar" dir="rtl">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5, viewport-fit=cover">
    <meta name="theme-color" content="#0a0e1a">
    <meta name="description" content="قراءة سور القرآن الكريم بالخط العثماني | سبيل الهدى">
    <meta name="author" content="سيف بن عمران (أبو البراء المصري)">

    <title>قراءة السورة | سبيل الهدى</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&family=Tajawal:wght@400;500;700;900&family=Amiri:wght@400;700&family=Amiri+Quran&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">

    <style>
        /* ═══════════════════════════════════════════
           خلفية المصحف
           ═══════════════════════════════════════════ */
        :root {
            --mushaf-bg: #f5e6c8;
            --mushaf-bg-2: #efe0bc;
            --mushaf-border: #8b6914;
            --mushaf-gold: #b8860b;
            --mushaf-text: #2c1810;
            --mushaf-text-muted: #6b4423;
            --mushaf-frame: #c9a961;
        }

        .surah-body {
            background: #0a0e1a;
            min-height: 100vh;
            padding-bottom: 80px;
        }

        /* شريط التحكم العلوي */
        .surah-toolbar {
            position: sticky;
            top: 60px;
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            padding: 12px 16px;
            background: rgba(10, 14, 26, 0.95);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(212, 175, 55, 0.2);
            margin-bottom: 20px;
        }

        .toolbar-info {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .toolbar-info .surah-name {
            font-family: var(--font-quran);
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--gold);
        }

        .toolbar-info .surah-meta {
            font-size: 0.7rem;
            color: var(--text-muted);
        }

        .toolbar-actions {
            display: flex;
            gap: 6px;
        }

        .tool-btn {
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            color: var(--text-primary);
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .tool-btn svg {
            width: 20px;
            height: 20px;
        }

        .tool-btn:active {
            transform: scale(0.92);
            background: rgba(212, 175, 55, 0.15);
            border-color: var(--gold);
            color: var(--gold);
        }

        .tool-btn.active {
            background: rgba(212, 175, 55, 0.2);
            border-color: var(--gold);
            color: var(--gold);
        }

        /* ═══════════════════════════════════════════
           صفحة المصحف
           ═══════════════════════════════════════════ */
        .mushaf-wrapper {
            max-width: 800px;
            margin: 0 auto;
            padding: 0 12px;
        }

        .mushaf-page {
            position: relative;
            background: linear-gradient(135deg, var(--mushaf-bg) 0%, var(--mushaf-bg-2) 100%);
            border-radius: 8px;
            padding: 40px 30px;
            box-shadow:
                0 20px 60px rgba(0, 0, 0, 0.5),
                inset 0 0 100px rgba(139, 105, 20, 0.05);
            overflow: hidden;
        }

        /* إطار ذهبي خارجي */
        .mushaf-page::before {
            content: '';
            position: absolute;
            inset: 12px;
            border: 3px solid var(--mushaf-frame);
            border-radius: 4px;
            pointer-events: none;
            box-shadow: inset 0 0 0 1px var(--mushaf-border);
        }

        /* إطار داخلي مزخرف */
        .mushaf-page::after {
            content: '';
            position: absolute;
            inset: 22px;
            border: 1px solid var(--mushaf-border);
            border-radius: 2px;
            pointer-events: none;
            opacity: 0.5;
        }

        /* زخرفة الزوايا */
        .corner-decoration {
            position: absolute;
            width: 60px;
            height: 60px;
            color: var(--mushaf-gold);
            opacity: 0.7;
            pointer-events: none;
        }

        .corner-decoration.tl { top: 18px; right: 18px; }
        .corner-decoration.tr { top: 18px; left: 18px; transform: scaleX(-1); }
        .corner-decoration.bl { bottom: 18px; right: 18px; transform: scaleY(-1); }
        .corner-decoration.br { bottom: 18px; left: 18px; transform: scale(-1); }

        /* ترويسة السورة داخل المصحف */
        .mushaf-surah-header {
            position: relative;
            z-index: 2;
            text-align: center;
            margin-bottom: 30px;
            padding-bottom: 20px;
        }

        .mushaf-surah-header::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 80%;
            height: 1px;
            background: linear-gradient(to right, transparent, var(--mushaf-border), transparent);
        }

        .surah-title-frame {
            display: inline-block;
            padding: 12px 40px;
            background: linear-gradient(135deg, rgba(184, 134, 11, 0.12), rgba(201, 169, 97, 0.08));
            border: 2px solid var(--mushaf-gold);
            border-radius: 50px;
            position: relative;
            box-shadow: 0 4px 20px rgba(139, 105, 20, 0.15);
        }

        .surah-title-frame::before,
        .surah-title-frame::after {
            content: '❖';
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            color: var(--mushaf-gold);
            font-size: 1.2rem;
        }

        .surah-title-frame::before { right: -20px; }
        .surah-title-frame::after { left: -20px; }

        .mushaf-surah-name {
            font-family: 'Amiri Quran', var(--font-quran);
            font-size: 1.8rem;
            font-weight: 700;
            color: var(--mushaf-text);
            letter-spacing: 1px;
        }

        .mushaf-surah-info {
            margin-top: 10px;
            font-size: 0.75rem;
            color: var(--mushaf-text-muted);
            font-weight: 600;
            font-family: var(--font-main);
        }

        /* البسملة */
        .bismillah {
            font-family: 'Amiri Quran', var(--font-quran);
            font-size: 1.5rem;
            color: var(--mushaf-text);
            text-align: center;
            margin: 20px 0 30px;
            padding: 10px 0;
            position: relative;
            z-index: 2;
        }

        /* نص المصحف */
        .mushaf-text {
            position: relative;
            z-index: 2;
            font-family: 'Amiri Quran', var(--font-quran);
            font-size: 1.7rem;
            line-height: 2.6;
            color: var(--mushaf-text);
            text-align: justify;
            text-align-last: center;
            direction: rtl;
            word-spacing: 3px;
            letter-spacing: 0.5px;
        }

        /* عدد الآيات (الدوائر) */
        .ayah-marker {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 42px;
            height: 42px;
            background: radial-gradient(circle, rgba(201, 169, 97, 0.25), rgba(184, 134, 11, 0.1));
            border: 2px solid var(--mushaf-gold);
            border-radius: 50%;
            font-family: 'Amiri Quran', var(--font-quran);
            font-size: 0.85rem;
            font-weight: 700;
            color: var(--mushaf-text);
            margin: 0 6px;
            vertical-align: middle;
            position: relative;
            box-shadow: 0 0 10px rgba(184, 134, 11, 0.15);
            line-height: 1;
        }

        .ayah-marker::before {
            content: '';
            position: absolute;
            inset: -4px;
            border: 1px dashed rgba(184, 134, 11, 0.5);
            border-radius: 50%;
        }

        /* تحميل */
        .loading-state {
            text-align: center;
            padding: 80px 20px;
            color: var(--text-muted);
        }

        .loading-state .spinner {
            width: 50px;
            height: 50px;
            border: 3px solid rgba(212, 175, 55, 0.2);
            border-top-color: var(--gold);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* خطأ */
        .error-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-muted);
            max-width: 500px;
            margin: 0 auto;
        }

        .error-state .icon {
            font-size: 3.5rem;
            margin-bottom: 16px;
        }

        .error-state h2 {
            font-family: var(--font-heading);
            color: var(--gold);
            font-size: 1.4rem;
            margin-bottom: 12px;
        }

        .error-state p {
            line-height: 1.8;
            margin-bottom: 20px;
        }

        .error-state button {
            padding: 12px 28px;
            background: linear-gradient(135deg, var(--gold), var(--gold-dark));
            color: #000;
            font-family: var(--font-heading);
            font-weight: 800;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            box-shadow: 0 0 20px var(--gold-glow);
        }

        /* التنقل السفلي */
        .surah-navigation {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            max-width: 800px;
            margin: 30px auto 0;
            padding: 0 12px;
        }

        .nav-surah-btn {
            flex: 1;
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 16px;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            color: var(--text-primary);
            text-decoration: none;
            transition: all 0.3s ease;
            min-width: 0;
        }

        .nav-surah-btn:hover {
            border-color: var(--gold);
            background: rgba(212, 175, 55, 0.05);
        }

        .nav-surah-btn:active {
            transform: scale(0.97);
        }

        .nav-surah-btn.next {
            justify-content: flex-end;
            text-align: left;
            flex-direction: row-reverse;
        }

        .nav-surah-btn .nav-arrow {
            width: 30px;
            height: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(212, 175, 55, 0.1);
            border-radius: 50%;
            color: var(--gold);
            flex-shrink: 0;
        }

        .nav-surah-btn .nav-arrow svg {
            width: 16px;
            height: 16px;
        }

        .nav-surah-btn .nav-info {
            min-width: 0;
            flex: 1;
        }

        .nav-surah-btn .nav-label {
            font-size: 0.65rem;
            color: var(--text-muted);
            margin-bottom: 2px;
        }

        .nav-surah-btn .nav-name {
            font-family: var(--font-quran);
            font-size: 0.95rem;
            font-weight: 700;
            color: var(--text-primary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .nav-surah-btn.next .nav-info {
            text-align: left;
        }

        .nav-surah-btn.disabled {
            opacity: 0.3;
            pointer-events: none;
        }

        /* الوضع الليلي (للمصحف) */
        body.dark-mushaf .mushaf-page {
            background: linear-gradient(135deg, #1a1410 0%, #221a14 100%);
        }

        body.dark-mushaf .mushaf-text,
        body.dark-mushaf .mushaf-surah-name,
        body.dark-mushaf .bismillah {
            color: #e8d9b8;
        }

        body.dark-mushaf .mushaf-surah-info {
            color: #c9a961;
        }

        body.dark-mushaf .ayah-marker {
            color: #e8d9b8;
        }

        /* للجوال */
        @media (max-width: 640px) {
            .surah-toolbar {
                top: 56px;
                padding: 10px 12px;
            }
            .toolbar-info .surah-name {
                font-size: 1rem;
            }
            .tool-btn {
                width: 38px;
                height: 38px;
            }
            .mushaf-wrapper {
                padding: 0 8px;
            }
            .mushaf-page {
                padding: 30px 18px;
            }
            .mushaf-text {
                font-size: 1.4rem;
                line-height: 2.4;
            }
            .mushaf-surah-name {
                font-size: 1.5rem;
            }
            .surah-title-frame {
                padding: 10px 24px;
            }
            .bismillah {
                font-size: 1.2rem;
            }
            .ayah-marker {
                width: 36px;
                height: 36px;
                font-size: 0.75rem;
            }
            .corner-decoration {
                width: 45px;
                height: 45px;
            }
        }

        /* حجم خط أكبر/أصغر */
        body.font-large .mushaf-text {
            font-size: 2.1rem;
            line-height: 3;
        }

        body.font-small .mushaf-text {
            font-size: 1.35rem;
            line-height: 2.3;
        }
    </style>
</head>

        // ═══════════════════════════════════════════
        // تحويل الأرقام إلى أرقام عربية
        // ═══════════════════════════════════════════
        function toArabicNumber(n) {
            const arabicDigits = ['٠','١','٢','٣','٤','٥','٦','٧','٨','٩'];
            return n.toString().split('').map(d => arabicDigits[parseInt(d)] || d).join('');
        }

        // ═══════════════════════════════════════════
        // الحصول على رقم السورة من الرابط
        // ═══════════════════════════════════════════
        function getSurahNumber() {
            const params = new URLSearchParams(window.location.search);
            let num = parseInt(params.get('num') || '1', 10);
            if (isNaN(num) || num < 1 || num > 114) num = 1;
            return num;
        }

        // ═══════════════════════════════════════════
        // تحميل السورة من API
        // ═══════════════════════════════════════════
        async function loadSurah(num) {
            const loadingState = document.getElementById('loadingState');
            const mushafPage = document.getElementById('mushafPage');
            const errorState = document.getElementById('errorState');
            const toolbar = document.getElementById('toolbar');
            const surahNav = document.getElementById('surahNav');

            try {
                const url = `https://api.alquran.cloud/v1/surah/${num}/quran-uthmani`;
                const response = await fetch(url);

                if (!response.ok) throw new Error('فشل الاتصال بالخادم');

                const data = await response.json();

                if (data.code !== 200 || !data.data) throw new Error('بيانات غير صالحة');

                const surah = data.data;
                renderSurah(surah, num);

                loadingState.style.display = 'none';
                mushafPage.style.display = 'block';
                toolbar.style.display = 'flex';
                surahNav.style.display = 'flex';

                document.title = `سورة ${surah.name} | سبيل الهدى`;

            } catch (error) {
                console.error('خطأ في تحميل السورة:', error);
                loadingState.style.display = 'none';
                errorState.style.display = 'block';
            }
        }

        // ═══════════════════════════════════════════
        // عرض السورة
        // ═══════════════════════════════════════════
        function renderSurah(surah, num) {
            document.getElementById('toolbarSurahName').textContent = `سورة ${surah.name}`;
            document.getElementById('toolbarSurahMeta').textContent = `${surah.revelationType === 'Meccan' ? 'مكية' : 'مدنية'} • ${surah.numberOfAyahs} آية`;

            document.getElementById('mushafSurahName').textContent = `سورة ${surah.name}`;
            document.getElementById('mushafSurahInfo').textContent = `${surah.revelationType === 'Meccan' ? 'مكية' : 'مدنية'} • ${surah.numberOfAyahs} آية • ترتيبها ${num}`;

            const bismillah = document.getElementById('bismillah');
            if (num !== 1 && num !== 9) {
                bismillah.style.display = 'block';
            } else {
                bismillah.style.display = 'none';
            }

            const mushafText = document.getElementById('mushafText');
            mushafText.innerHTML = '';

            surah.ayahs.forEach((ayah, index) => {
                let text = ayah.text;
                if (num !== 1 && index === 0) {
                    const bismillahText = 'بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ';
                    if (text.startsWith(bismillahText)) {
                        text = text.replace(bismillahText, '').trim();
                    }
                }

                const ayahSpan = document.createElement('span');
                ayahSpan.textContent = text + ' ';
                mushafText.appendChild(ayahSpan);

                const marker = document.createElement('span');
                marker.className = 'ayah-marker';
                marker.textContent = toArabicNumber(ayah.numberInSurah);
                mushafText.appendChild(marker);

                mushafText.appendChild(document.createTextNode(' '));
            });

            updateNavigation(num);

            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // ═══════════════════════════════════════════
        // التنقل بين السور
        // ═══════════════════════════════════════════
        function updateNavigation(currentNum) {
            const prevBtn = document.getElementById('prevBtn');
            const nextBtn = document.getElementById('nextBtn');
            const prevSurahName = document.getElementById('prevSurahName');
            const nextSurahName = document.getElementById('nextSurahName');

            if (currentNum > 1) {
                const prev = surahsList[currentNum - 2];
                prevSurahName.textContent = `سورة ${prev.name}`;
                prevBtn.href = `surah.html?num=${currentNum - 1}`;
                prevBtn.classList.remove('disabled');
            } else {
                prevBtn.classList.add('disabled');
                prevBtn.removeAttribute('href');
                prevSurahName.textContent = '—';
            }

            if (currentNum < 114) {
                const next = surahsList[currentNum];
                nextSurahName.textContent = `سورة ${next.name}`;
                nextBtn.href = `surah.html?num=${currentNum + 1}`;
                nextBtn.classList.remove('disabled');
            } else {
                nextBtn.classList.add('disabled');
                nextBtn.removeAttribute('href');
                nextSurahName.textContent = '—';
            }
        }

        // ═══════════════════════════════════════════
        // التهيئة
        // ═══════════════════════════════════════════
        document.addEventListener('DOMContentLoaded', () => {
            const num = getSurahNumber();
            loadSurah(num);

            const yearEl = document.getElementById('year');
            if (yearEl) yearEl.textContent = new Date().getFullYear();

            const fontToggle = document.getElementById('fontToggle');
            let fontState = localStorage.getItem('sabeel_font') || 'normal';
            applyFontState(fontState);

            if (fontToggle) {
                fontToggle.addEventListener('click', () => {
                    if (fontState === 'normal') fontState = 'large';
                    else if (fontState === 'large') fontState = 'small';
                    else fontState = 'normal';
                    applyFontState(fontState);
                    localStorage.setItem('sabeel_font', fontState);
                });
            }

            const mushafThemeToggle = document.getElementById('mushafThemeToggle');
            let mushafDark = localStorage.getItem('sabeel_mushaf_dark') === 'true';

            if (mushafDark) {
                document.body.classList.add('dark-mushaf');
                if (mushafThemeToggle) mushafThemeToggle.classList.add('active');
            }

            if (mushafThemeToggle) {
                mushafThemeToggle.addEventListener('click', () => {
                    document.body.classList.toggle('dark-mushaf');
                    const isDark = document.body.classList.contains('dark-mushaf');
                    localStorage.setItem('sabeel_mushaf_dark', isDark);
                    mushafThemeToggle.classList.toggle('active', isDark);
                });
            }

            const backToTop = document.getElementById('backToTop');
            if (backToTop) {
                window.addEventListener('scroll', () => {
                    backToTop.classList.toggle('visible', window.pageYOffset > 400);
                });
                backToTop.addEventListener('click', () => {
                    window.scrollTo({ top: 0, behavior: 'smooth' });
                });
            }
        });

        function applyFontState(state) {
            document.body.classList.remove('font-large', 'font-small');
            if (state === 'large') document.body.classList.add('font-large');
            else if (state === 'small') document.body.classList.add('font-small');
        }
    </script>
