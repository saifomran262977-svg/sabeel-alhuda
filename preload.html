<!doctype html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5, viewport-fit=cover">
    <meta name="theme-color" content="#0a0e1a">
    <title>تحميل المحتوى | سبيل الهدى</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&family=Tajawal:wght@400;700;900&family=Amiri:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #0a0e1a;
            --bg-card: rgba(15, 21, 36, 0.95);
            --gold-light: #f4d03f;
            --gold: #d4af37;
            --gold-dark: #a8842a;
            --emerald-light: #34d399;
            --emerald: #10b981;
            --text-primary: #f8fafc;
            --text-secondary: #cbd5e1;
            --text-muted: #94a3b8;
            --border-color: rgba(255, 255, 255, 0.08);
            --border-gold: rgba(212, 175, 55, 0.3);
            --font-main: 'Tajawal', system-ui, sans-serif;
            --font-heading: 'Cairo', system-ui, sans-serif;
            --font-quran: 'Amiri', serif;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: var(--font-main);
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            padding: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow-x: hidden;
        }

        body::before, body::after {
            content: '';
            position: fixed;
            border-radius: 50%;
            filter: blur(120px);
            z-index: 0;
            pointer-events: none;
        }

        body::before {
            width: 400px;
            height: 400px;
            background: #047857;
            top: -150px;
            right: -150px;
            opacity: 0.3;
        }

        body::after {
            width: 500px;
            height: 500px;
            background: #b45309;
            bottom: -200px;
            left: -200px;
            opacity: 0.25;
        }

        .preload-card {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 500px;
            padding: 40px 30px;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 24px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6),
                        0 0 60px rgba(212, 175, 55, 0.08);
        }

        .preload-icon {
            width: 100px;
            height: 100px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 24px;
            background: linear-gradient(135deg, var(--gold), var(--gold-dark));
            border-radius: 50%;
            box-shadow: 0 0 50px rgba(212, 175, 55, 0.4);
            font-size: 3rem;
            position: relative;
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); box-shadow: 0 0 50px rgba(212, 175, 55, 0.4); }
            50% { transform: scale(1.05); box-shadow: 0 0 80px rgba(212, 175, 55, 0.6); }
        }

        .preload-icon::before {
            content: '';
            position: absolute;
            inset: -10px;
            border: 1px dashed rgba(212, 175, 55, 0.4);
            border-radius: 50%;
            animation: rotate 20s linear infinite;
        }

        @keyframes rotate {
            to { transform: rotate(360deg); }
        }

        .preload-title {
            font-family: var(--font-heading);
            font-size: 1.6rem;
            font-weight: 900;
            text-align: center;
            margin-bottom: 12px;
            background: linear-gradient(135deg, var(--gold-light), var(--emerald-light));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .preload-subtitle {
            text-align: center;
            font-size: 0.92rem;
            color: var(--text-muted);
            margin-bottom: 30px;
            line-height: 1.7;
        }

        /* قائمة التحميل */
        .preload-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 24px;
            max-height: 300px;
            overflow-y: auto;
        }

        .preload-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 16px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            transition: all 0.3s;
            font-size: 0.88rem;
        }

        .preload-item.done {
            background: rgba(16, 185, 129, 0.08);
            border-color: rgba(16, 185, 129, 0.3);
        }

        .preload-item.loading {
            background: rgba(212, 175, 55, 0.08);
            border-color: rgba(212, 175, 55, 0.3);
        }

        .preload-item .item-icon {
            width: 24px;
            height: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.85rem;
            flex-shrink: 0;
        }

        .preload-item .item-icon .spinner-small {
            width: 16px;
            height: 16px;
            border: 2px solid rgba(212, 175, 55, 0.3);
            border-top-color: var(--gold);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .preload-item .item-text {
            flex: 1;
            color: var(--text-secondary);
            font-weight: 600;
        }

        /* شريط التقدم */
        .progress-bar {
            width: 100%;
            height: 8px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
            overflow: hidden;
            margin-bottom: 12px;
            border: 1px solid var(--border-color);
        }

        .progress-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, var(--gold), var(--emerald));
            border-radius: 10px;
            transition: width 0.3s ease;
            box-shadow: 0 0 15px rgba(212, 175, 55, 0.5);
        }

        .progress-text {
            text-align: center;
            font-size: 0.82rem;
            color: var(--text-muted);
            margin-bottom: 20px;
            font-weight: 600;
        }

        .progress-text b {
            color: var(--gold);
            font-size: 1rem;
        }

        /* الأزرار */
        .start-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            padding: 18px;
            background: linear-gradient(135deg, var(--gold-light), var(--gold-dark));
            color: #000;
            font-family: var(--font-heading);
            font-size: 1.05rem;
            font-weight: 800;
            border: none;
            border-radius: 14px;
            cursor: pointer;
            box-shadow: 0 8px 25px rgba(212, 175, 55, 0.3);
            transition: all 0.3s;
            margin-bottom: 12px;
        }

        .start-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 35px rgba(212, 175, 55, 0.45);
        }

        .start-btn:active {
            transform: scale(0.97);
        }

        .start-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .back-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
            padding: 14px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border-color);
            color: var(--text-secondary);
            font-family: var(--font-heading);
            font-size: 0.9rem;
            font-weight: 700;
            border-radius: 12px;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.3s;
        }

        .back-btn:hover {
            border-color: var(--gold);
            color: var(--gold);
        }

        /* رسالة النجاح */
        .success-msg {
            display: none;
            padding: 20px;
            background: rgba(16, 185, 129, 0.1);
            border: 1px solid rgba(16, 185, 129, 0.3);
            border-radius: 14px;
            text-align: center;
            margin-bottom: 20px;
        }

        .success-msg.show {
            display: block;
            animation: fadeIn 0.5s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .success-msg .success-icon {
            font-size: 2.5rem;
            margin-bottom: 10px;
        }

        .success-msg .success-title {
            font-family: var(--font-heading);
            font-size: 1.15rem;
            font-weight: 800;
            color: var(--emerald-light);
            margin-bottom: 6px;
        }

        .success-msg .success-text {
            font-size: 0.85rem;
            color: var(--text-muted);
            line-height: 1.7;
        }

        .verse {
            text-align: center;
            font-family: var(--font-quran);
            font-size: 0.88rem;
            color: var(--gold);
            margin-top: 20px;
            padding-top: 18px;
            border-top: 1px dashed rgba(212, 175, 55, 0.3);
            line-height: 1.8;
        }
    </style>
</head>
<body>

    <div class="preload-card">

        <!-- الأيقونة -->
        <div class="preload-icon">📥</div>

        <!-- العنوان -->
        <h1 class="preload-title">تحميل المحتوى</h1>
        <p class="preload-subtitle">
            سيتم تحميل كل صفحات المنصة ومحتواها.<br>
            بعد انتهاء التحميل، سيعمل التطبيق بدون إنترنت.
        </p>

        <!-- رسالة النجاح -->
        <div class="success-msg" id="successMsg">
            <div class="success-icon">✅</div>
            <div class="success-title">تم التحميل بنجاح</div>
            <div class="success-text">
                التطبيق الآن يعمل بدون إنترنت.<br>
                يمكنك إغلاق الإنترنت والتصفح بحرية.
            </div>
        </div>

        <!-- شريط التقدم -->
        <div class="progress-bar">
            <div class="progress-fill" id="progressFill"></div>
        </div>
        <div class="progress-text">
            <b id="progressPercent">0%</b> — <span id="progressLabel">جاهز للبدء</span>
        </div>

        <!-- قائمة الملفات -->
        <div class="preload-list" id="preloadList"></div>

        <!-- الأزرار -->
        <button class="start-btn" id="startBtn">
            <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                <polyline points="7 10 12 15 17 10"/>
                <line x1="12" y1="15" x2="12" y2="3"/>
            </svg>
            ابدأ التحميل
        </button>

        <a href="index.html" class="back-btn">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <line x1="19" y1="12" x2="5" y2="12"/>
                <polyline points="12 19 5 12 12 5"/>
            </svg>
            العودة للرئيسية
        </a>

        <div class="verse">
            ﴿ وَمَن يَبْتَغِ غَيْرَ الْإِسْلَامِ دِينًا فَلَن يُقْبَلَ مِنْهُ ﴾
        </div>

    </div>

    <script>
        // ═══════════════════════════════════════════
        // قائمة الملفات المطلوب تحميلها
        // ═══════════════════════════════════════════
        var FILES_TO_PRELOAD = [
            { url: 'index.html',           name: 'الصفحة الرئيسية',      icon: '🏠' },
            { url: 'quran.html',           name: 'فهرس القرآن',          icon: '📖' },
            { url: 'surah.html?num=1',     name: 'سورة الفاتحة',         icon: '📖' },
            { url: 'surah.html?num=2',     name: 'سورة البقرة',          icon: '📖' },
            { url: 'surah.html?num=36',    name: 'سورة يس',              icon: '📖' },
            { url: 'surah.html?num=67',    name: 'سورة الملك',           icon: '📖' },
            { url: 'surah.html?num=112',   name: 'سورة الإخلاص',         icon: '📖' },
            { url: 'hadith.html',          name: 'السنّة النبوية',       icon: '📚' },
            { url: 'scholars.html',        name: 'أهل العلم',            icon: '👨‍🏫' },
            { url: 'ahmad.html',           name: 'الإمام أحمد بن حنبل',   icon: '📜' },
            { url: 'ibn-taymiyyah.html',   name: 'شيخ الإسلام ابن تيمية', icon: '📜' },
            { url: 'ibn-qayyim.html',      name: 'الإمام ابن القيم',      icon: '📜' },
            { url: 'abdulwahhab.html',     name: 'الإمام محمد بن عبد الوهاب', icon: '📜' },
            { url: 'athkar.html',          name: 'الأذكار والأدعية',      icon: '📿' },
            { url: 'news.html',            name: 'الأخبار الرسمية',      icon: '📰' },
            { url: 'about.html',           name: 'عن المنصة',            icon: 'ℹ️' },
            { url: 'contact.html',         name: 'التواصل',              icon: '📞' }
        ];

        // ═══════════════════════════════════════════
        // عناصر الصفحة
        // ═══════════════════════════════════════════
        var listEl = document.getElementById('preloadList');
        var progressFill = document.getElementById('progressFill');
        var progressPercent = document.getElementById('progressPercent');
        var progressLabel = document.getElementById('progressLabel');
        var startBtn = document.getElementById('startBtn');
        var successMsg = document.getElementById('successMsg');

        var completed = 0;
        var total = FILES_TO_PRELOAD.length;

        // ═══════════════════════════════════════════
        // بناء القائمة
        // ═══════════════════════════════════════════
        function buildList() {
            listEl.innerHTML = '';
            FILES_TO_PRELOAD.forEach(function(item, index) {
                var el = document.createElement('div');
                el.className = 'preload-item';
                el.id = 'item-' + index;
                el.innerHTML = `
                    <div class="item-icon">${item.icon}</div>
                    <div class="item-text">${item.name}</div>
                `;
                listEl.appendChild(el);
            });
        }

        // ═══════════════════════════════════════════
        // تحديث التقدم
        // ═══════════════════════════════════════════
        function updateProgress() {
            var percent = Math.round((completed / total) * 100);
            progressFill.style.width = percent + '%';
            progressPercent.textContent = percent + '%';
            progressLabel.textContent = completed + ' / ' + total + ' صفحة';
        }

        // ═══════════════════════════════════════════
        // تحميل ملف واحد
        // ═══════════════════════════════════════════
        function preloadOne(item, index) {
            return new Promise(function(resolve) {
                var el = document.getElementById('item-' + index);
                if (el) {
                    el.classList.add('loading');
                    el.querySelector('.item-icon').innerHTML = '<div class="spinner-small"></div>';
                }

                // جلب الملف (هذا يُخزّنه في Service Worker Cache)
                fetch(item.url, { cache: 'reload' })
                    .then(function() {
                        if (el) {
                            el.classList.remove('loading');
                            el.classList.add('done');
                            el.querySelector('.item-icon').innerHTML = '✅';
                        }
                        completed++;
                        updateProgress();
                        resolve();
                    })
                    .catch(function() {
                        if (el) {
                            el.classList.remove('loading');
                            el.querySelector('.item-icon').innerHTML = '⚠️';
                        }
                        completed++;
                        updateProgress();
                        resolve();
                    });
            });
        }

        // ═══════════════════════════════════════════
        // تحميل كل الملفات
        // ═══════════════════════════════════════════
        async function preloadAll() {
            startBtn.disabled = true;
            startBtn.innerHTML = '⏳ جارٍ التحميل...';

            for (var i = 0; i < FILES_TO_PRELOAD.length; i++) {
                await preloadOne(FILES_TO_PRELOAD[i], i);
                // انتظر قليلاً بين كل ملف
                await new Promise(function(r) { setTimeout(r, 300); });
            }

            // انتهى التحميل
            startBtn.style.display = 'none';
            successMsg.classList.add('show');
            progressLabel.textContent = 'تم التحميل بنجاح';

            // تخزين علامة أن التحميل تم
            try {
                localStorage.setItem('sabeel_preloaded', 'true');
            } catch (e) {}
        }

        // ═══════════════════════════════════════════
        // التهيئة
        // ═══════════════════════════════════════════
        buildList();
        updateProgress();

        startBtn.addEventListener('click', function() {
            preloadAll();
        });

    </script>

</body>
</html>
