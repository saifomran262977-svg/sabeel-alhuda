<!doctype html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5, viewport-fit=cover">
    <meta name="theme-color" content="#0a0e1a">
    <meta name="description" content="الأخبار الرسمية | سبيل الهدى - آخر مستجدات المنصة">
    <meta name="author" content="سيف بن عمران (أبو البراء المصري)">

    <title>الأخبار الرسمية | سبيل الهدى</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&family=Tajawal:wght@400;500;700;900&family=Amiri:wght@400;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">

    <style>
        .news-page {
            max-width: 820px;
            margin: 0 auto;
            padding: 20px 16px 80px;
        }

        .news-header {
            text-align: center;
            padding: 30px 0 30px;
        }

        .news-header-icon {
            width: 80px;
            height: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
            background: linear-gradient(135deg, var(--gold), var(--gold-dark));
            border-radius: 50%;
            box-shadow: 0 0 40px var(--gold-glow);
            font-size: 2.5rem;
            animation: floatIcon 3s ease-in-out infinite;
        }

        @keyframes floatIcon {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }

        .news-header h1 {
            font-family: var(--font-heading);
            font-size: 2rem;
            font-weight: 900;
            background: linear-gradient(135deg, var(--gold-light), var(--emerald-light));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 10px;
        }

        .news-header p {
            color: var(--text-muted);
            font-size: 0.95rem;
            max-width: 500px;
            margin: 0 auto;
            line-height: 1.8;
        }

        .search-box {
            position: relative;
            margin: 0 auto 20px;
            max-width: 600px;
        }

        .search-box input {
            width: 100%;
            padding: 16px 52px 16px 18px;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            color: var(--text-primary);
            font-family: var(--font-heading);
            font-size: 0.95rem;
            font-weight: 600;
            transition: all var(--transition);
            outline: none;
        }

        .search-box input:focus {
            border-color: var(--gold);
            box-shadow: 0 0 0 4px rgba(212, 175, 55, 0.12);
        }

        .search-box svg {
            position: absolute;
            top: 50%;
            right: 18px;
            transform: translateY(-50%);
            width: 20px;
            height: 20px;
            color: var(--gold);
            pointer-events: none;
        }

        .info-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 18px;
            background: var(--bg-glass);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            margin-bottom: 20px;
            font-size: 0.82rem;
            color: var(--text-muted);
        }

        .info-bar b {
            color: var(--gold);
            font-weight: 800;
        }

        /* قائمة الأخبار */
        .news-list {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .news-card {
            position: relative;
            padding: 22px;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            box-shadow: var(--shadow-sm);
            transition: all var(--transition);
            overflow: hidden;
            opacity: 0;
            transform: translateY(15px);
            animation: newsEnter 0.5s ease forwards;
        }

        @keyframes newsEnter {
            to { opacity: 1; transform: translateY(0); }
        }

        .news-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(212, 175, 55, 0.06), transparent);
            transition: left 0.8s ease;
            pointer-events: none;
        }

        .news-card:hover::before {
            left: 100%;
        }

        .news-card::after {
            content: '';
            position: absolute;
            top: 0;
            right: 0;
            width: 4px;
            height: 100%;
            background: linear-gradient(to bottom, var(--gold), var(--emerald));
        }

        .news-card:hover {
            transform: translateY(-3px);
            border-color: var(--gold);
            box-shadow: 0 10px 30px rgba(212, 175, 55, 0.1);
        }

        .news-top {
            display: flex;
            align-items: flex-start;
            gap: 14px;
            margin-bottom: 14px;
        }

        .news-icon {
            width: 54px;
            height: 54px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(212, 175, 55, 0.12);
            border: 1px solid var(--border-gold);
            border-radius: var(--radius-md);
            font-size: 1.6rem;
            flex-shrink: 0;
        }

        .news-meta {
            flex: 1;
            min-width: 0;
        }

        .news-date {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 0.72rem;
            color: var(--gold);
            font-weight: 700;
            font-family: var(--font-heading);
            margin-bottom: 4px;
        }

        .news-title {
            font-family: var(--font-heading);
            font-size: 1.15rem;
            font-weight: 800;
            color: var(--text-primary);
            line-height: 1.4;
        }

        .news-badge {
            display: inline-block;
            font-size: 0.65rem;
            font-weight: 800;
            padding: 3px 10px;
            background: linear-gradient(135deg, #ef4444, #b91c1c);
            color: #fff;
            border-radius: 50px;
            margin-right: 8px;
            vertical-align: middle;
            box-shadow: 0 0 12px rgba(239, 68, 68, 0.4);
            animation: badgePulse 1.5s infinite;
            font-family: var(--font-heading);
            letter-spacing: 0.5px;
        }

        @keyframes badgePulse {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.06); opacity: 0.85; }
        }

        .news-content {
            font-size: 0.95rem;
            color: var(--text-secondary);
            line-height: 2;
            padding-top: 14px;
            border-top: 1px solid var(--border-color);
            text-align: justify;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-muted);
        }

        .empty-state .icon {
            font-size: 3rem;
            margin-bottom: 12px;
        }

        @media (max-width: 640px) {
            .news-header h1 { font-size: 1.6rem; }
            .news-title { font-size: 1.05rem; }
            .news-icon { width: 46px; height: 46px; font-size: 1.3rem; }
        }
    </style>
</head>
<body>

    <div class="scroll-progress" id="scrollProgress"></div>

    <div class="ambient ambient-1"></div>
    <div class="ambient ambient-2"></div>
    <div class="grid-overlay"></div>
    <div class="stars-overlay"></div>

    <header class="topbar" id="topbar">
        <a href="index.html" class="brand">
            <div class="logo-icon"><span>ه</span></div>
            <div class="logo-text">
                <h1>سبيل الهدى</h1>
                <p>الأخبار الرسمية</p>
            </div>
        </a>
        <div class="header-actions">
            <button class="icon-btn theme-toggle" id="themeToggle" aria-label="تغيير المظهر">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/></svg>
            </button>
            <button class="menu-btn" id="menuBtn" aria-label="القائمة">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
            </button>
        </div>
    </header>

    <div class="nav-overlay" id="navOverlay"></div>
    <nav class="nav-menu" id="navMenu">
        <div class="nav-header">
            <div class="nav-logo"><span>ه</span></div>
            <div class="nav-title">
                <b>سبيل الهدى</b>
                <small>منصة إسلامية شاملة</small>
            </div>
        </div>
        <div class="nav-links">
            <a href="index.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg> الرئيسية</a>
            <a href="quran.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg> القرآن الكريم</a>
            <a href="hadith.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg> السنّة النبوية</a>
            <a href="scholars.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/></svg> أهل العلم</a>
            <a href="news.html" class="active"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 22h16a2 2 0 0 0 2-2V4a2 2 0 0 0-2-2H8a2 2 0 0 0-2 2v16a2 2 0 0 1-2 2Z"/></svg> الأخبار</a>
            <a href="athkar.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83"/></svg> الأذكار</a>
        </div>
    </nav>

    <main class="news-page">

        <div class="news-header">
            <div class="news-header-icon">📰</div>
            <h1>الأخبار الرسمية</h1>
            <p>تابع آخر مستجدات المنصة، والكتب الجديدة، والإضافات.</p>
        </div>

        <div class="search-box">
            <input type="text" id="searchInput" placeholder="ابحث في الأخبار...">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="11" cy="11" r="8"/>
                <line x1="21" y1="21" x2="16.65" y2="16.65"/>
            </svg>
        </div>

        <div class="info-bar">
            <span>عدد الأخبار: <b id="countDisplay">0</b></span>
            <span>آخر تحديث: <b id="lastUpdate">—</b></span>
        </div>

        <div class="news-list" id="newsList"></div>

    </main>

    <footer class="footer">
        <div class="footer-quote">
            <span>ﷲ</span>
            الله أكبر — والعزة لله ولرسوله وللمؤمنين
        </div>
        <div class="footer-bottom">
            <small>© <span id="year"></span> سبيل الهدى — صدقة لله</small>
        </div>
    </footer>

    <button class="fab fab-top" id="backToTop" aria-label="الأعلى">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="12" y1="19" x2="12" y2="5"/>
            <polyline points="5 12 12 5 19 12"/>
        </svg>
    </button>

    <script src="config.js"></script>
    <script src="main.js"></script>

    <script>
        // ═══════════════════════════════════════════
        // عرض الأخبار
        // ═══════════════════════════════════════════
        const listEl = document.getElementById('newsList');
        const searchInput = document.getElementById('searchInput');
        const countDisplay = document.getElementById('countDisplay');
        const lastUpdate = document.getElementById('lastUpdate');

        let currentSearch = '';

        // الحصول على الأخبار من config.js
        function getNews() {
            if (typeof siteConfig !== 'undefined' && siteConfig.news) {
                return siteConfig.news;
            }
            return [];
        }

        function render() {
            const newsList = getNews();
            const filtered = newsList.filter(n => {
                if (currentSearch === '') return true;
                return n.title.includes(currentSearch) ||
                       n.content.includes(currentSearch) ||
                       (n.date && n.date.includes(currentSearch));
            });

            countDisplay.textContent = filtered.length;

            if (newsList.length > 0) {
                lastUpdate.textContent = newsList[0].date || '—';
            }

            listEl.innerHTML = '';

            if (filtered.length === 0) {
                listEl.innerHTML = `
                    <div class="empty-state">
                        <div class="icon">📭</div>
                        <p>لا توجد أخبار مطابقة.</p>
                    </div>
                `;
                return;
            }

            filtered.forEach((n, i) => {
                const card = document.createElement('div');
                card.className = 'news-card';
                card.style.animationDelay = Math.min(i * 0.05, 0.5) + 's';

                card.innerHTML = `
                    <div class="news-top">
                        <div class="news-icon">${n.icon || '📰'}</div>
                        <div class="news-meta">
                            <div class="news-date">
                                <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <rect x="3" y="4" width="18" height="18" rx="2" ry="2"/>
                                    <line x1="16" y1="2" x2="16" y2="6"/>
                                    <line x1="8" y1="2" x2="8" y2="6"/>
                                    <line x1="3" y1="10" x2="21" y2="10"/>
                                </svg>
                                ${n.date || ''}
                            </div>
                            <div class="news-title">
                                ${n.isNew ? '<span class="news-badge">جديد</span>' : ''}
                                ${n.title}
                            </div>
                        </div>
                    </div>
                    <div class="news-content">${n.content}</div>
                `;

                listEl.appendChild(card);
            });
        }

        searchInput.addEventListener('input', (e) => {
            currentSearch = e.target.value.trim();
            render();
        });

        render();

        // السنة
        const yearEl = document.getElementById('year');
        if (yearEl) yearEl.textContent = new Date().getFullYear();

        // زر الأعلى
        const backToTop = document.getElementById('backToTop');
        if (backToTop) {
            window.addEventListener('scroll', () => {
                backToTop.classList.toggle('visible', window.pageYOffset > 400);
            });
            backToTop.addEventListener('click', () => {
                window.scrollTo({ top: 0, behavior: 'smooth' });
            });
        }
    </script>

</body>
</html>
