<!doctype html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5">
    <meta name="theme-color" content="#0a0e1a">
    <meta name="robots" content="noindex, nofollow">
    <title>دخول | سبيل الهدى</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;800;900&family=Tajawal:wght@400;700;900&family=Amiri:wght@400;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-primary: #0a0e1a;
            --bg-card: rgba(15, 21, 36, 0.95);
            --gold-light: #f4d03f;
            --gold: #d4af37;
            --gold-dark: #a8842a;
            --emerald-light: #34d399;
            --text-primary: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: rgba(255, 255, 255, 0.08);
            --border-gold: rgba(212, 175, 55, 0.3);
            --font-main: 'Tajawal', system-ui, sans-serif;
            --font-heading: 'Cairo', system-ui, sans-serif;
            --font-quran: 'Amiri', serif;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            height: 100%;
            overflow: hidden;
        }

        body {
            font-family: var(--font-main);
            background: var(--bg-primary);
            color: var(--text-primary);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            position: relative;
        }

        /* خلفيات متوهجة */
        body::before, body::after {
            content: '';
            position: fixed;
            border-radius: 50%;
            filter: blur(120px);
            z-index: 0;
            pointer-events: none;
        }

        body::before {
            width: 400px;
            height: 400px;
            background: #047857;
            top: -150px;
            right: -150px;
            opacity: 0.3;
        }

        body::after {
            width: 500px;
            height: 500px;
            background: #b45309;
            bottom: -200px;
            left: -200px;
            opacity: 0.25;
        }

        /* بطاقة الدخول */
        .login-card {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 420px;
            padding: 40px 30px;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 24px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6),
                        0 0 60px rgba(212, 175, 55, 0.08);
            animation: cardEnter 0.6s ease;
        }

        @keyframes cardEnter {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* أيقونة القفل */
        .lock-icon {
            width: 90px;
            height: 90px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
            background: linear-gradient(135deg, var(--gold-light), var(--gold-dark));
            border-radius: 50%;
            box-shadow: 0 0 40px rgba(212, 175, 55, 0.4);
            position: relative;
        }

        .lock-icon::before {
            content: '';
            position: absolute;
            inset: -8px;
            border: 1px dashed rgba(212, 175, 55, 0.4);
            border-radius: 50%;
        }

        .lock-icon svg {
            width: 42px;
            height: 42px;
            stroke: #000;
            stroke-width: 2;
            fill: none;
        }

        /* العنوان */
        .login-title {
            font-family: var(--font-heading);
            font-size: 1.6rem;
            font-weight: 900;
            text-align: center;
            margin-bottom: 8px;
            background: linear-gradient(135deg, var(--gold-light), var(--emerald-light));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .login-subtitle {
            text-align: center;
            font-size: 0.9rem;
            color: var(--text-muted);
            margin-bottom: 30px;
            line-height: 1.7;
        }

        /* النموذج */
        .login-form {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .password-field {
            position: relative;
        }

        .password-field input {
            width: 100%;
            padding: 18px 52px 18px 18px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            color: var(--text-primary);
            font-family: var(--font-heading);
            font-size: 1.1rem;
            font-weight: 700;
            text-align: center;
            letter-spacing: 4px;
            transition: all 0.3s;
            outline: none;
        }

        .password-field input::placeholder {
            color: var(--text-muted);
            letter-spacing: 8px;
            font-weight: 400;
        }

        .password-field input:focus {
            border-color: var(--gold);
            box-shadow: 0 0 0 4px rgba(212, 175, 55, 0.12);
            background: rgba(212, 175, 55, 0.03);
        }

        .toggle-password {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            width: 36px;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: transparent;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            border-radius: 50%;
            transition: all 0.3s;
        }

        .toggle-password:hover {
            color: var(--gold);
            background: rgba(212, 175, 55, 0.1);
        }

        .toggle-password svg {
            width: 20px;
            height: 20px;
            stroke: currentColor;
            fill: none;
            stroke-width: 2;
        }

        /* رسالة الخطأ/النجاح */
        .login-error {
            padding: 14px;
            border-radius: 12px;
            font-size: 0.88rem;
            font-weight: 600;
            text-align: center;
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: #fca5a5;
            display: none;
        }

        .login-error.show {
            display: block;
            animation: slideDown 0.3s ease;
        }

        .login-error.success {
            background: rgba(16, 185, 129, 0.1);
            border-color: rgba(16, 185, 129, 0.3);
            color: var(--emerald-light);
        }

        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20% { transform: translateX(-8px); }
            40% { transform: translateX(8px); }
            60% { transform: translateX(-6px); }
            80% { transform: translateX(6px); }
        }

        /* زر الدخول */
        .login-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 18px;
            background: linear-gradient(135deg, var(--gold-light), var(--gold-dark));
            color: #000;
            font-family: var(--font-heading);
            font-size: 1.05rem;
            font-weight: 800;
            border: none;
            border-radius: 14px;
            cursor: pointer;
            box-shadow: 0 8px 25px rgba(212, 175, 55, 0.3);
            transition: all 0.3s;
        }

        .login-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 30px rgba(212, 175, 55, 0.45);
        }

        .login-btn:active {
            transform: scale(0.97);
        }

        .login-btn svg {
            width: 20px;
            height: 20px;
            stroke: #000;
            fill: none;
            stroke-width: 2;
        }

        /* العودة للرئيسية */
        .back-home {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-top: 20px;
            padding: 14px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            color: var(--text-muted);
            font-family: var(--font-heading);
            font-size: 0.9rem;
            font-weight: 600;
            text-decoration: none;
            transition: all 0.3s;
        }

        .back-home:hover {
            border-color: var(--gold);
            color: var(--gold);
        }

        .back-home svg {
            width: 18px;
            height: 18px;
            stroke: currentColor;
            fill: none;
            stroke-width: 2;
        }

        /* آية ختامية */
        .login-verse {
            margin-top: 24px;
            padding-top: 20px;
            border-top: 1px dashed var(--border-color);
            text-align: center;
            font-family: var(--font-quran);
            font-size: 0.92rem;
            color: var(--gold);
            line-height: 1.9;
        }

        .login-verse .brand {
            display: block;
            margin-top: 10px;
            font-family: var(--font-heading);
            font-size: 0.75rem;
            color: var(--text-muted);
            font-weight: 600;
        }

        @media (max-width: 480px) {
            .login-card {
                padding: 30px 22px;
            }
            .lock-icon {
                width: 75px;
                height: 75px;
            }
            .lock-icon svg {
                width: 34px;
                height: 34px;
            }
            .login-title {
                font-size: 1.35rem;
            }
        }
    </style>
</head>
<body>

    <div class="login-card">

        <!-- أيقونة القفل -->
        <div class="lock-icon">
            <svg viewBox="0 0 24 24">
                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
                <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
            </svg>
        </div>

        <!-- العنوان -->
        <h1 class="login-title">دخول المنصة</h1>
        <p class="login-subtitle">هذه المنصة محمية. يرجى إدخال الرمز للمتابعة.</p>

        <!-- النموذج -->
        <form class="login-form" id="loginForm" autocomplete="off" novalidate>
            <div class="password-field">
                <input
                    type="password"
                    id="passwordInput"
                    placeholder="••••"
                    inputmode="numeric"
                    autocomplete="off"
                    required
                >
                <button type="button" class="toggle-password" id="togglePassword" aria-label="إظهار الرمز">
                    <svg viewBox="0 0 24 24">
                        <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                        <circle cx="12" cy="12" r="3"/>
                    </svg>
                </button>
            </div>

            <div class="login-error" id="loginError"></div>

            <button type="submit" class="login-btn">
                <svg viewBox="0 0 24 24">
                    <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/>
                    <polyline points="10 17 15 12 10 7"/>
                    <line x1="15" y1="12" x2="3" y2="12"/>
                </svg>
                دخول
            </button>
        </form>

        <!-- العودة للرئيسية -->
        <a href="index.html" class="back-home">
            <svg viewBox="0 0 24 24">
                <line x1="19" y1="12" x2="5" y2="12"/>
                <polyline points="12 19 5 12 12 5"/>
            </svg>
            العودة إلى الرئيسية
        </a>

        <!-- آية ختامية -->
        <div class="login-verse">
            ﴿ وَقُل رَّبِّ زِدْنِي عِلْمًا ﴾
            <span class="brand">سبيل الهدى — منصة إسلامية شاملة</span>
        </div>

    </div>

    <!-- ملفات البرمجة -->
    <script src="config.js"></script>
    <script src="auth.js"></script>

</body>
</html>
